<style>

in-width:0;padding:14px 0;outline:0}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0;scrollbar-width:none}.chip{white-space:nowrap;min-height:40px;font-size:14px;padding:7px 15px;background:white;border:1px solid var(--line);border-radius:22px}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.sectionline{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px;font-size:14px;color:var(--muted)}.card{padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:22px;margin:0 0 16px}.meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.source{font-size:13px;line-height:1.7;color:var(--muted);min-width:0;overflow-wrap:anywhere}.source strong{display:block;color:#40506b;font-size:14px;font-weight:600}.tag{border-radius:8px;background:var(--soft);color:#204fba;font-size:12px;font-weight:650;padding:4px 9px;flex-shrink:0}.tag.竞赛{color:#6c4a9b;background:#f2edf9}.tag.考试{color:#a54a2e;background:#fbefe9}.tag.活动{color:#277161;background:#eaf5f0}.card h2{font-size:21px;line-height:1.45;margin:18px 0 12px;overflow-wrap:anywhere}.requirements{margin:0 0 18px;padding-left:18px;font-size:15px;color:#52617b}.requirements li{padding-left:2px;margin:6px 0}.deadline{background:#f6f8fc;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;color:#455775;font-size:14px}.deadline strong{display:block;font-size:16px;color:var(--ink)}.deadline.pending strong{color:var(--muted)}.deadline .clock{color:#7890b8}.actions{display:flex;justify-content:space-between;gap:8px;padding-top:14px}.primary{background:var(--blue);color:white;font-weight:600}.secondary{background:var(--soft);color:var(--blue)}.textbtn{padding-left:0;color:var(--muted);font-size:14px}.count{font-size:12px;color:var(--muted);margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);padding:8px 10px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10;backdrop-filter:blur(14px)}.bottom button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#64728b;font-size:11px;padding:6px;border-radius:14px}.bottom .active{color:var(--blue);background:#f0f4ff;font-weight:650}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0;overflow-wrap:anywhere}.row:last-child{border:0}.empty{text-align:center;padding:42px 24px;background:white;border:1px dashed #cbd5e7;border-radius:22px}.empty svg{width:40px;height:40px;color:#8da3ca;margin-bottom:12px}.formlabel{display:block;font-size:14px;margin:14px 0 6px;color:var(--muted)}input.field,textarea{display:block;width:100%;padding:12px;border:1px solid #cdd6e5;border-radius:12px;background:#fff;color:var(--ink);min-height:48px}textarea{min-height:140px;resize:vertical}dialog{border:1px solid var(--line);border-radius:24px;width:calc(100% - 32px);max-width:560px;max-height:85dvh;padding:24px;color:var(--ink);box-shadow:0 20px 80px #19243d30}dialog::backdrop{background:#19243d65}dialog .close{float:right;padding:0;width:48px;margin:-8px -8px 0 0}.original{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:14px;padding:18px;margin:18px 0}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#19243d;color:white;padding:12px 20px;border-radius:14px;z-index:30;max-width:90%;font-size:14px}.status{display:inline-block;font-size:12px;color:#31705f;background:#eaf5ef;border-radius:8px;padding:3px 8px}.error{color:#a54a2e}.bannerline{border-left:3px solid var(--blue);padding-left:12px}.block{width:100%}.divider{margin:22px 0;border:0;border-top:1px solid var(--line)}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(min-width:600px){.wrap{padding-top:32px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cards .card{margin:0;display:flex;flex-direction:column}.cards .actions{margin-top:auto}.card h2{font-size:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:48px;padding:10px 0}details .original{font-size:14px;margin:8px 0}.pending-entry{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:white;border-radius:14px;text-align:left;margin-bottom:16px}.cancel{color:var(--muted);padding-left:0}.actions{flex-wrap:wrap}.group-search{margin:16px 0}#groupSearch::-webkit-search-cancel-button{-webkit-appearance:none}.group-search button{flex-shrink:0;padding:10px}.group-row>div{min-width:0;overflow-wrap:anywhere}.group-row>button{flex-shrink:0;white-space:nowrap}.group-results{margin-top:16px}.card-tools{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:14px}.menu-actions{display:grid;gap:12px;margin:24px 0}.danger{background:#fceeed;color:#a52c26}.field,select.field{width:100%;min-height:48px;padding:12px;border:1px solid #cdd6e5;border-radius:12px;background:var(--paper);color:var(--ink);font:inherit}select:focus-visible{outline:3px solid var(--blue)}.state-tabs .chip{min-height:48px}.requirements li{white-space:pre-wrap;overflow-wrap:anywhere}.deadline strong{overflow-wrap:anywhere}.actions>*{flex:1}.card-tools .textbtn:last-child{padding-right:0}dialog h2{padding-right:40px}dialog form{clear:both}.chips{flex-wrap:wrap;overflow:visible}.chip{min-height:48px}button:disabled{opacity:.5;cursor:default}@media(max-width:360px){.wrap{padding-inline:12px}.card{padding:16px}.actions button{padding-inline:10px;font-size:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.discard-prompt{border:1px solid var(--warm);border-radius:12px;padding:16px;margin:16px 0}.discard-prompt h3{font-size:18px;margin:0}</style></head><body><main class="wrap"><header><div class="brandline"><span class="mark" id="logo"></span><div class="brand">寻迹<small>FOLLOW WHAT MATTERS</small></div></div><button class="round" aria-label="添加" onclick="addMenu()" id="add"></button></header><div id="app"></div></main><nav class="bottom" aria-label="主导航" id="nav"></nav><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
const paths={inbox:'M4 4h16v16H4z M4 13h5l2 3h2l2-3h5',todo:'M9 5h11 M9 12h11 M9 19h11 M3 5l1 1 2-3 M3 12l1 1 2-3 M3 19l1 1 2-3',groups:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.9 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',clock:'M12 8v4l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',logo:'M5 6h14L5 18h14 M5 12h14',close:'M6 6l12 12 M6 18L18 6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.inbox}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const native=typeof Xunji!=='undefined';let page='inbox',groupBucket='followed',groupTabChosen=false,category='全部',query='',groupQuery='',tab='todo',inboxTab='inbox';
let real={cards:[],sources:[],groups:[],candidates:[],hasKey:false,accessibility:false,notifications:false};
const data=()=>real;
const act=(type,value='')=>{if(native){Xunji.action(type,value)}else toast('请在手机寻迹中使用此功能')};
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3000)}
let previousSnapshot='';function refreshNative(){if(native){try{const raw=Xunji.snapshot();const result=JSON.parse(raw);if(result.error){toast(result.error);return}if(raw!==previousSnapshot){previousSnapshot=raw;real=result;render()}}catch{toast('读取手机数据失败')}}}window.refreshNative=refreshNative;
function go(value){page=value;query='';category='全部';render();window.scrollTo(0,0)}
function mutate(type,payload){
 if(!native||typeof Xunji.mutate!=='function'){toast('请安装新版寻迹后使用');return false}
 try{const result=JSON.parse(Xunji.mutate(type,JSON.stringify(payload)));if(!result.ok){showSaveError(result.error||'保存失败，请重试');return false}refreshNative();return true}catch{showSaveError('保存失败，请重试');return false}
}
function showSaveError(message){const el=document.getElementById('saveError');if(el&&document.getElementById('modal').open){el.textContent=message;el.hidden=false}else toast(message)}
function state(id,value){if(mutate('card',{id,state:value}))toast(({todo:'已加入待办',done:'已完成',inbox:'已回到收件箱',ignored:'已忽略，可随时恢复',restore:'已恢复到删除前状态',deleted:'已移入回收站'})[value]||'已更新')}
function card(c){const source=data().sources.find(s=>s.id===c.sourceId);const siblings=data().cards.filter(v=>v.sourceId===c.sourceId&&v.status!=='deleted').length;
 let actions=c.status==='inbox'?`<button class="secondary" onclick="state('${esc(c.id)}','ignored')">不加入待办</button><button class="primary" onclick="state('${esc(c.id)}','todo')">加入待办</button>`:c.status==='todo'?`<button class="cancel" onclick="state('${esc(c.id)}','inbox')">取消待办</button><button class="primary" onclick="state('${esc(c.id)}','done')">标记完成</button>`:c.status==='ignored'?`<button class="secondary" onclick="state('${esc(c.id)}','inbox')">恢复到收件箱</button>`:c.status==='deleted'?`<button class="secondary" onclick="state('${esc(c.id)}','restore')">恢复事项</button>`:`<button class="secondary" onclick="state('${esc(c.id)}','todo')">恢复待办</button>`;
 return `<article class="card"><div class="meta"><div class="source"><strong>${esc(c.group)}</strong>发布人 · ${esc(c.publisher||'未识别')}</div><span class="tag ${esc(c.category)}">${esc(c.category)}</span></div><h2>${esc(c.title)}</h2>${c.requirements.length?`<ul class="requirements">${c.requirements.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="muted small">未填写具体要求</p>'}<div class="deadline ${c.deadline?'':'pending'}"><span class="clock">${icon('clock')}</span><div><span class="small">${c.category==='考试'?'时间信息':'截止时间'}</span><strong>${esc(c.deadline||'未设置')}</strong></div></div><div class="actions">${actions}</div><div class="card-tools"><button class="textbtn" onclick="original('${esc(c.sourceId)}')">查看原文 ↗</button>${c.status!=='deleted'?`<button class="textbtn" aria-label="更多操作" onclick="cardMenu('${esc(c.id)}')">更多</button>`:''}</div>${c.userModified?'<p class="small muted">已保留你的修改与决定</p>':''}${siblings>1?`<div class="count">同一条原文 · 已拆分 ${siblings} 个事项</div>`:''}<details><summary>附：来源原文</summary><div class="original">${esc(source?.text||'原文暂不可用')}</div></details></article>`}
function render(){const titles={inbox:['让重要的事，有迹可循。','从群消息里，找到你的下一步。'],todo:['专注接下来的一步。','把通知变成行动，慢慢完成。'],groups:['只关注，你在意的群。','选择会一直保留，随时可以增减。'],pending:['待处理的消息','原文已保存，等待自动整理。'],settings:['按你的节奏，整理。','连接 DeepSeek，让文字成为清晰的事项。']};const [title,subtitle]=titles[page];let html=`<h1>${title}</h1><p class="muted">${subtitle}</p>`;
if(page==='inbox'||page==='todo'){
html+=`<label class="search">${icon('search')}<input id="search" aria-label="搜索事项、群名或发布人" placeholder="搜索事项、群名或发布人" value="${esc(query)}" oninput="query=this.value;renderList()"></label>`;
if(page==='inbox')html+=`<div class="toolbar state-tabs" role="group" aria-label="收件箱范围">${[['inbox','待确认'],['ignored','已忽略'],['deleted','回收站']].map(([id,label])=>`<button class="chip ${inboxTab===id?'active':''}" aria-pressed="${inboxTab===id}" onclick="inboxTab='${id}';render()">${label}</button>`).join('')}<button class="secondary" onclick="editCard()">新建事项</button></div>`;
if(page==='todo')html+=`<div class="toolbar"><button class="chip ${tab==='todo'?'active':''}" onclick="tab='todo';render()">未完成</button><button class="chip ${tab==='done'?'active':''}" onclick="tab='done';render()">已完成</button><button class="secondary" onclick="editCard()">新建事项</button></div>`;
html+=`<div class="chips" aria-label="事项分类">${['全部','作业','竞赛','考试','活动','其他'].map(v=>`<button class="chip ${v===category?'active':''}" onclick="category='${v}';render()">${v}</button>`).join('')}</div><div id="list"></div>`;
}else if(page==='pending'){
const pending=real.sources.filter(v=>v.aiState!=='ready');
html+=`<p class="muted small">${real.hasKey?'联网后，新消息会自动整理；失败的消息留在这里。':'请先在设置中配置密钥；配置后，等待中的消息会自动整理。'}</p><div class="toolbar"><button class="secondary" onclick="go('inbox')">返回收件箱</button>${pending.some(s=>s.aiState==='error')?`<button class="secondary" onclick="act('retryPending')">重试失败消息</button>`:''}</div>`;
html+=pending.length?pending.map(s=>`<article class="card"><div class="meta"><div class="source"><strong>${esc(s.group)}</strong>发布人 · ${esc(s.publisher||'未识别')}</div><span class="tag">${s.aiState==='processing'?'整理中':s.aiState==='error'?'暂未成功':real.hasKey?'等待联网整理':'等待配置'}</span></div><p class="original">${esc(s.text)}</p>${s.error?`<p class="error small">${esc(s.error)}</p>`:''}</article>`).join(''):'<div class="empty"><h2>没有待处理消息</h2><p class="small muted">整理成功的事项会自动进入收件箱。</p></div>';
 }else if(page==='groups'){
const n=real.napcat||{groups:[],followed:[],pending:[],status:'等待配置本机连接'};n.pending=n.pending||[];
if(!groupTabChosen){groupBucket=n.followed.length?'followed':'available';groupTabChosen=true;}
html+=`<div class="notice">${esc(n.status)}<br>只接收关注之后的新消息。</div><div class="toolbar"><button class="secondary" onclick="go('settings')">管理 QQ 连接</button></div>`;
const followedCount=n.groups.filter(g=>n.followed.includes(String(g.group_id))).length;
html+=`<section class="card"><h2>关注群</h2><div class="group-tabs" role="group" aria-label="群列表范围"><button aria-pressed="${groupBucket==='available'}" class="${groupBucket==='available'?'active':''}" onclick="setGroupBucket('available')">待关注群 · ${n.groups.length-followedCount}</button><button aria-pressed="${groupBucket==='followed'}" class="${groupBucket==='followed'?'active':''}" onclick="setGroupBucket('followed')">已关注群 · ${followedCount}</button></div><label class="search group-search">${icon('search')}<input id="groupSearch" type="search" aria-label="搜索群名或群号" placeholder="搜索群名或群号" autocomplete="off" value="${esc(groupQuery)}" oninput="groupQuery=this.value;renderGroupList()"><button type="button" id="clearGroupSearch" aria-label="清空群搜索" onclick="clearGroupSearch()" ${groupQuery?'':'hidden'}>${icon('close')}</button></label><div id="groupList" class="group-results"></div></section>`;
html+=`<p class="small muted bannerline">取消关注后，已经保存的原文和卡片会保留。</p>`;

}else{
html+=`<section class="card"><div class="meta"><h2>DeepSeek</h2><span class="tag">云端提取</span></div><p class="small muted">手机联网后自动整理文字。电脑负责接收 QQ 消息，演示时请保持电脑运行和 USB 连接。</p><label class="formlabel" for="key">API 密钥 · ${real.hasKey?'已配置':'未配置'}</label><input class="field" type="password" id="key" autocomplete="off" placeholder="在手机上填写，不要发到聊天中"><div class="toolbar"><button class="primary" onclick="saveKey()">保存密钥</button><button class="textbtn" onclick="act('clearKey')">移除密钥</button></div><p class="small muted">密钥加密保存在本机；暂时无法整理的原文会保存在待处理。</p></section><section class="card"><h2>QQ 连接</h2><p class="muted small">${esc(real.napcat?.status||'等待连接 QQ 接入端')}</p><label class="formlabel" for="napcatKey">本机连接口令 · ${real.napcat?.hasToken?'已保存':'未配置'}</label><input class="field" id="napcatKey" type="password" autocomplete="off" placeholder="本机 NapCat 的接口口令"><div class="toolbar"><button class="primary" onclick="connectNapCat()">保存并连接</button><button class="textbtn" onclick="act('napcatStop')">暂停接收</button></div><p class="small muted">电脑端 NapCat 登录后保持 USB 连接，再到关注群页面选择群。断开 USB 后需重新运行电脑启动脚本。</p><div class="row"><span>诊断工具</span><button class="textbtn" onclick="act('diagnostics')">打开 ↗</button></div></section><p class="muted small">寻迹<br>当前支持文字消息整理，图片和附件暂不处理。</p>`;
}
document.getElementById('app').innerHTML=html;document.getElementById('nav').innerHTML=[['inbox','收件箱'],['todo','待办'],['groups','关注群'],['settings','设置']].map(([id,name])=>`<button class="${page===id||(page==='pending'&&id==='inbox')?'active':''}" ${page===id?'aria-current="page"':''} onclick="go('${id}')">${icon(id)}<span>${name}</span></button>`).join('');if(page==='inbox'||page==='todo')renderList();if(page==='groups')renderGroupList();}
function renderGroupList(){
 const n=real.napcat||{groups:[],followed:[],pending:[]};const all=n.groups.filter(g=>groupBucket==='followed'?(n.followed||[]).includes(String(g.group_id)):!(n.followed||[]).includes(String(g.group_id)));const term=groupQuery.trim().toLocaleLowerCase();
 const matches=all.filter(g=>!term||String(g.group_name||'').toLocaleLowerCase().includes(term)||String(g.group_id||'').includes(term));
 let html=`<p class="small muted" role="status" aria-live="polite" aria-atomic="true">显示 ${matches.length} / ${all.length} 个群</p>`;
 html+=matches.map(g=>{const id=String(g.group_id||'');const followed=(n.followed||[]).includes(id),pending=(n.pending||[]).includes(id);return `<div class="row group-row"><div><strong>${esc(g.group_name)}</strong>${g.group_id?`<div class="small muted">群号 ${esc(g.group_id)}</div>`:''}</div>${`<button class="${followed||pending?'secondary':'primary'}" aria-pressed="${followed}" onclick="act('${followed||pending?'napcatUnfollow':'napcatFollow'}','${esc(id)}')">${pending?'取消准备':followed?'取消关注':'关注'}</button>`}</div>`}).join('');
 if(!matches.length)html+=`<p class="muted">${term?'当前分组没有匹配的群，请换个关键词或清空搜索。':groupBucket==='followed'?'还没有已关注群，请到待关注群中选择。':n.groups.length?'所有群都已关注。':'连接并登录 QQ 后，这里会显示群列表。'}</p>`;
 document.getElementById('groupList').innerHTML=html;document.getElementById('clearGroupSearch').hidden=!groupQuery;
}
function setGroupBucket(value){groupBucket=value;groupTabChosen=true;render()}
function clearGroupSearch(){groupQuery='';document.getElementById('groupSearch').value='';renderGroupList();document.getElementById('groupSearch').focus()}
function renderList(){let cards=data().cards.filter(c=>c.status===(page==='inbox'?inboxTab:tab)).filter(c=>(category==='全部'||c.category===category)&&(!query||[c.title,c.group,c.publisher,c.deadline,...c.requirements].join(' ').toLowerCase().includes(query.toLowerCase())));let html=`<div class="sectionline"><span>${page==='inbox'?({inbox:'待确认的事项',ignored:'已忽略',deleted:'回收站'})[inboxTab]:'我的待办'} · ${cards.length}</span><span>保留原文</span></div>`;
if(page==='inbox'&&inboxTab==='inbox'){const count=real.sources.filter(s=>s.aiState!=='ready').length;if(count)html+=`<button class="pending-entry" onclick="go('pending')"><span>待处理 <strong>${count}</strong><span class="small muted"> · 原文已保留</span></span><span>查看 ›</span></button>`;}

html+=cards.length?`<div class="cards">${cards.map(card).join('')}</div>`:`<div class="empty">${icon(page)}<h2>${query||category!=='全部'?'没有匹配的事项':page==='inbox'?({inbox:'这里等着你的下一条消息',ignored:'没有已忽略的事项',deleted:'回收站为空'})[inboxTab]:'暂时没有待办'}</h2><p class="muted small">${inboxTab==='deleted'&&page==='inbox'?'删除的事项会保留在这里，随时可以恢复。':inboxTab==='ignored'&&page==='inbox'?'不加入待办的事项会保留在这里。':'可以新建事项，或关注 QQ 群接收通知。'}</p></div>`;document.getElementById('list').innerHTML=html;}
let lastFocus;function modal(html){const existing=document.getElementById('modal');if(existing.open){existing.close()}else lastFocus=document.activeElement;const el=document.getElementById('modal');el.innerHTML=`<button class="close" aria-label="关闭" onclick="document.getElementById('modal').close()">${icon('close')}</button>${html}`;el.showModal()}document.getElementById('modal').addEventListener('close',()=>lastFocus?.focus());
function original(id){const s=data().sources.find(s=>s.id===id);if(!s)return;const siblings=data().cards.filter(c=>c.sourceId===id);modal(`<h2>消息原文</h2><div class="source"><strong>${esc(s.group)}</strong>发布人 · ${esc(s.publisher||'未识别')}</div><div class="original">${esc(s.text)}</div><p class="muted small">接收时间 · ${new Date(s.receivedAt).toLocaleString('zh-CN')}</p><hr class="divider"><h2>来自这条消息的 ${siblings.length} 个事项</h2>${siblings.map(c=>`<div class="row"><span>${esc(c.title)}</span><span class="tag">${esc(c.category)}</span></div>`).join('')}<p class="small muted">提取结果请与原文核对。时间按原文保留，未明确的内容不会自动补全。</p>`)}
let editingId='',editorInitial='';
function addMenu(){modal(`<h2>添加</h2><div class="menu-actions"><button class="primary" onclick="editCard()">新建事项</button><button class="secondary" onclick="paste()">粘贴通知原文</button></div><p class="small muted">新建事项直接加入待办；通知原文会自动整理。</p>`)}
function cardMenu(id){const c=data().cards.find(c=>c.id===id);if(!c)return;modal(`<h2>管理事项</h2><p>${esc(c.title)}</p><div class="menu-actions"><button class="secondary" onclick="editCard('${esc(id)}')">编辑事项</button><button class="danger" onclick="deleteCard('${esc(id)}')">删除事项</button></div>`)}
function deleteCard(id){const c=data().cards.find(c=>c.id===id);if(!c)return;modal(`<h2>删除这个事项？</h2><p>${esc(c.title)}</p><p class="muted small">移入回收站后可恢复。来源原文和同一原文的其他事项会保留。</p><p id="saveError" class="error" role="alert" hidden></p><div class="toolbar"><button class="secondary" onclick="document.getElementById('modal').close()">取消</button><button class="danger" id="confirmDelete">移入回收站</button></div>`);document.getElementById('confirmDelete').onclick=()=>{if(mutate('card',{id,state:'deleted'})){document.getElementById('modal').close();toast('已移入回收站，可随时恢复')}}}
function editCard(id=''){const c=id?data().cards.find(c=>c.id===id):{title:'',category:'其他',requirements:[],deadline:''};if(!c)return;editingId=id;
 modal(`<h2>${id?'编辑事项':'新建事项'}</h2><p class="small muted">${id?'修改仅影响这张卡片，来源原文保持不变。':'无需配置密钥，保存后直接加入待办。'}</p><form id="cardForm"><label class="formlabel" for="cardTitle">标题</label><input class="field" id="cardTitle" maxlength="300" required><label class="formlabel" for="cardCategory">分类</label><select class="field" id="cardCategory">${['作业','考试','竞赛','活动','其他'].map(v=>`<option>${v}</option>`).join('')}</select><label class="formlabel" for="cardRequirements">具体要求</label><textarea id="cardRequirements" maxlength="50000" placeholder="每行一项，可留空"></textarea><label class="formlabel" for="cardDeadline">截止时间</label><input class="field" id="cardDeadline" maxlength="500" placeholder="可留空，按你需要填写"><p id="saveError" class="error" role="alert" tabindex="-1" hidden></p><div class="toolbar"><button type="button" class="secondary" onclick="closeEditor()">取消</button><button class="primary" type="submit">${id?'保存修改':'创建待办'}</button></div></form>`);
 document.getElementById('cardTitle').value=c.title;document.getElementById('cardCategory').value=c.category;document.getElementById('cardRequirements').value=c.requirements.join('\n');document.getElementById('cardDeadline').value=c.deadline;
 editorInitial=JSON.stringify(editorValue());document.getElementById('cardForm').onsubmit=e=>{e.preventDefault();saveCard()};document.querySelector('#modal .close').onclick=closeEditor;document.getElementById('cardTitle').focus();
}
function editorValue(){return {id:editingId,title:document.getElementById('cardTitle').value.trim(),category:document.getElementById('cardCategory').value,requirements:document.getElementById('cardRequirements').value.split('\n').map(v=>v.trim()).filter(Boolean),deadline:document.getElementById('cardDeadline').value.trim()}}
function requestEditorExit(after){
 const dialog=document.getElementById('modal');
 if(!document.getElementById('cardForm')||JSON.stringify(editorValue())===editorInitial){dialog.close();if(after)after();return}
 let prompt=document.getElementById('discardPrompt');if(prompt)prompt.remove();
 prompt=document.createElement('section');prompt.id='discardPrompt';prompt.className='discard-prompt';prompt.setAttribute('role','alert');
 prompt.innerHTML='<h3>放弃尚未保存的修改？</h3><p class="small">当前内容尚未保存。</p><div class="toolbar"><button type="button" class="secondary" id="keepEditing">继续编辑</button><button type="button" class="danger" id="discardEditing">放弃修改</button></div>';
 document.getElementById('cardForm').prepend(prompt);document.getElementById('keepEditing').onclick=()=>{prompt.remove();document.getElementById('cardTitle').focus()};document.getElementById('discardEditing').onclick=()=>{dialog.close();if(after)after()};prompt.scrollIntoView({block:'nearest'});document.getElementById('keepEditing').focus();
}
function closeEditor(){requestEditorExit()}

function saveCard(){const value=editorValue();if(!value.title){showSaveError('请填写标题');document.getElementById('cardTitle').focus();return}if(mutate(editingId?'updateCard':'createCard',value)){document.getElementById('modal').close();toast(editingId?'已保存修改':'已创建待办')}}
 document.getElementById('modal').addEventListener('cancel',e=>{if(document.getElementById('cardForm')){e.preventDefault();closeEditor()}});
function paste(sharedText=""){if(document.getElementById('modal').open&&document.getElementById('cardForm')){requestEditorExit(()=>paste(sharedText));return}modal(`<h2>粘贴一条通知</h2><p class="muted small">原文先保存，配置密钥后会自动整理成卡片。</p><label class="formlabel" for="group">来源群</label><input class="field" id="group" value="手动输入"><label class="formlabel" for="publisher">发布人 · 可留空</label><input class="field" id="publisher"><label class="formlabel" for="body">通知原文</label><textarea id="body" maxlength="50000" placeholder="粘贴 QQ 通知文字…"></textarea><div class="toolbar"><button class="primary" onclick="savePaste()">保存并自动整理</button></div>`);document.getElementById('body').value=sharedText;}
function savePaste(){const text=document.getElementById('body').value.trim();if(!text)return toast('请先填写原文');if(!native)return toast('请在手机上保存消息');act('paste',JSON.stringify({group:document.getElementById('group').value||'手动输入',publisher:document.getElementById('publisher').value,text}));document.getElementById('modal').close();page='inbox';render()}
function connectNapCat(){const input=document.getElementById('napcatKey');act('napcatConnect',input.value);input.value=''}
function prefillNapCatToken(token){page='settings';render();document.getElementById('napcatKey').value=token;toast('本机口令已填入，请保存并连接')}
function saveKey(){const el=document.getElementById('key');if(!el.value.trim())return toast('请先填写密钥');act('saveKey',el.value);el.value=''}
function unfollow(index){const name=real.groups[index];modal(`<h2>取消关注这个群？</h2><p>${esc(name)}</p><p class="muted small">已有原文和卡片会保留，此后的新通知不再接收。</p><button class="primary" id="unfollowConfirm">确认取消关注</button>`);document.getElementById('unfollowConfirm').onclick=()=>{act('unfollow',name);document.getElementById('modal').close()}}
document.getElementById('logo').innerHTML=icon('logo');document.getElementById('add').innerHTML=icon('plus');render();refreshNative();setInterval(()=>{if(native&&!document.getElementById('modal').open&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA')refreshNative()},4000);
</script></body></html>
