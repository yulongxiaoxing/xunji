</style></head><body><div id="pullStatus" role="status" aria-live="polite" hidden></div><main class="wrap"><header><div class="brandline"><span class="mark" id="logo"></span><div class="brand">寻迹<small>FOLLOW WHAT MATTERS</small></div></div><button class="round" aria-label="添加" onclick="addMenu()" id="add"></button></header><div id="app"></div></main><nav class="bottom" aria-label="主导航" id="nav"></nav><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
const paths={today:'M3 12l9-9 9 9 M5 10v11h14V10 M9 21v-7h6v7',schedule:'M4 5h16v16H4z M4 10h16 M8 3v4 M16 3v4',inbox:'M4 4h16v16H4z M4 13h5l2 3h2l2-3h5',todo:'M9 5h11 M9 12h11 M9 19h11 M3 5l1 1 2-3 M3 12l1 1 2-3 M3 19l1 1 2-3',groups:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.9 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',plus:'M12 5v14 M5 12h14',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',clock:'M12 8v4l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',logo:'M5 6h14L5 18h14 M5 12h14',close:'M6 6l12 12 M6 18L18 6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.inbox}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const native=typeof Xunji!=='undefined';let page='today',groupBucket='followed',groupTabChosen=false,category='全部',query='',groupQuery='',tab='todo',inboxTab='inbox',selectedDate='',showScheduleDone=false,calendarView='week',courseDate='',courseQuery='',courseTrash=false,coursePinned=false;
let real={cards:[],sources:[],groups:[],candidates:[],hasKey:false,accessibility:false,notifications:false};
const data=()=>real;
const act=(type,value='')=>{if(native){Xunji.action(type,value)}else toast('请在手机寻迹中使用此功能')};
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3000)}
let renderedDay='',previousSnapshot='';function refreshNative(){if(native){try{const raw=Xunji.snapshot();const result=JSON.parse(raw);if(result.error){toast(result.error);return}if(raw!==previousSnapshot||renderedDay!==localDay()){previousSnapshot=raw;real=result;render()}refreshWeekNow()}catch{toast('读取手机数据失败')}}}window.refreshNative=refreshNative;
function go(value){page=value;query='';category='全部';refreshNative();render();window.scrollTo(0,0)}
function mutate(type,payload){
 if(!native||typeof Xunji.mutate!=='function'){toast('请安装新版寻迹后使用');return false}
 try{const result=JSON.parse(Xunji.mutate(type,JSON.stringify(payload)));if(!result.ok){showSaveError(result.error||'保存失败，请重试');return false}window.lastMutation=result;refreshNative();return true}catch{showSaveError('保存失败，请重试');return false}
}
function showSaveError(message){const el=document.getElementById('saveError');if(el&&document.getElementById('modal').open){el.textContent=message;el.hidden=false}else toast(message)}
function state(id,value){if(mutate('card',{id,state:value})){if(document.getElementById('agendaDetail'))document.getElementById('modal').close();toast(({todo:'已加入待办',done:'已完成',inbox:'已回到收件箱',ignored:'已忽略，可随时恢复',restore:'已恢复到删除前状态',deleted:'已移入回收站'})[value]||'已更新')}}
function card(c){const source=data().sources.find(s=>s.id===c.sourceId);const siblings=data().cards.filter(v=>v.sourceId===c.sourceId&&v.status!=='deleted').length;
 let actions=c.category==='课程'?(c.status==='deleted'?`<button class="secondary" onclick="state('${esc(c.id)}','restore')">恢复课程</button>`:'<p class="small muted">按下课时间自动完成，未下课不会提前勾选。</p>'):c.status==='inbox'?`<button class="secondary" onclick="state('${esc(c.id)}','ignored')">不加入待办</button><button class="primary" onclick="state('${esc(c.id)}','todo')">加入待办</button>`:c.status==='todo'?`<button class="cancel" onclick="state('${esc(c.id)}','inbox')">取消待办</button><button class="primary" onclick="state('${esc(c.id)}','done')">标记完成</button>`:c.status==='ignored'?`<button class="secondary" onclick="state('${esc(c.id)}','inbox')">恢复到收件箱</button>`:c.status==='deleted'?`<button class="secondary" onclick="state('${esc(c.id)}','restore')">恢复事项</button>`:`<button class="secondary" onclick="state('${esc(c.id)}','todo')">恢复待办</button>`;
 return `<article class="card"><div class="meta"><div class="source"><strong>${esc(c.group)}</strong>${c.category==='课程'?'老师':'发布人'} · ${esc(c.category==='课程'?(c.course?.teacher||'未注明'):(c.publisher||'未识别'))}</div><span class="tag ${esc(c.category)}">${esc(c.category)}</span></div><h2>${esc(c.title)}</h2>${c.category==='课程'&&c.course?courseFacts(c.course):c.event?eventFacts(c.event):''}${c.requirements.length?`<ul class="requirements">${c.requirements.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="muted small">未填写具体要求</p>'}<div class="deadline ${c.deadline?'':'pending'}"><span class="clock">${icon('clock')}</span><div><span class="small">${c.category==='课程'?'上课时间':c.event?'安排时间':c.category==='考试'?'时间信息':'截止时间'}</span><strong>${esc(c.category==='课程'&&c.course?c.course.startTime+'—'+c.course.endTime:c.event?c.event.startTime+'—'+c.event.endTime:(c.deadline||'未设置'))}</strong></div></div><div class="actions">${actions}</div><p class="small muted schedule-note">${c.dueDate?` ${c.category==='课程'?'上课日期':c.event?'安排日期':'日程截止'} · ${esc(c.dueDate)} ${esc(c.dueTime||'未注明时刻')}${c.scheduleOverride?' · 已手动调整':''}`:'按消息截止时间自动显示；未注明时间的事项仍保留待办'}</p><div class="card-tools"><button class="textbtn" onclick="original('${esc(c.sourceId)}')">查看原文 ↗</button>${c.status!=='deleted'?`<button class="textbtn" aria-label="更多操作" onclick="cardMenu('${esc(c.id)}')">更多</button>`:''}</div>${c.userModified?'<p class="small muted">已保留你的修改与决定</p>':''}${siblings>1?`<div class="count">同一条原文 · 已拆分 ${siblings} 个事项</div>`:''}<details><summary>附：来源原文</summary><div class="original">${esc(source?.text||'原文暂不可用')}</div></details></article>`}
function render(){document.body.classList.toggle("schedule-screen",page==="schedule");captureWeekScroll();renderedDay=localDay();if(page==='today'||page==='schedule'){renderHub();return}const titles={inbox:['让重要的事，有迹可循。','从群消息里，找到你的下一步。'],todo:['专注接下来的一步。','把通知变成行动，慢慢完成。'],groups:['只关注，你在意的群。','选择会一直保留，随时可以增减。'],pending:['待处理的消息','原文已保存，等待自动整理。'],settings:['按你的节奏，整理。','连接 DeepSeek，让文字成为清晰的事项。']};const [title,subtitle]=titles[page];let html=`<h1>${title}</h1><p class="muted">${subtitle}</p>`;
if(page==='inbox'||page==='todo'){
html+=`<label class="search">${icon('search')}<input id="search" aria-label="搜索事项、群名或发布人" placeholder="搜索事项、群名或发布人" value="${esc(query)}" oninput="query=this.value;renderList()"></label>`;
if(page==='inbox')html+=`<div class="toolbar state-tabs" role="group" aria-label="收件箱范围">${[['inbox','待确认'],['ignored','已忽略'],['deleted','回收站']].map(([id,label])=>`<button class="chip ${inboxTab===id?'active':''}" aria-pressed="${inboxTab===id}" onclick="inboxTab='${id}';render()">${label}</button>`).join('')}<button class="secondary" onclick="chooseNewCategory()">新建事项</button></div>`;
if(page==='todo')html+=`<div class="toolbar"><button class="chip ${tab==='todo'?'active':''}" onclick="tab='todo';render()">未完成</button><button class="chip ${tab==='done'?'active':''}" onclick="tab='done';render()">已完成</button><button class="secondary" onclick="chooseNewCategory()">新建事项</button></div>`;
html+=`<div class="chips" aria-label="事项分类">${['全部','作业','竞赛','考试','活动','其他'].map(v=>`<button class="chip ${v===category?'active':''}" onclick="category='${v}';render()">${v}</button>`).join('')}</div><div id="list"></div>`;
}else if(page==='pending'){
const pending=real.sources.filter(v=>v.aiState!=='ready');
html+=`<p class="muted small">${real.hasKey?'联网后，新消息会自动整理；失败的消息留在这里。':'请先在设置中配置密钥；配置后，等待中的消息会自动整理。'}</p><div class="toolbar"><button class="secondary" onclick="go('inbox')">返回收件箱</button>${pending.some(s=>s.aiState==='error')?`<button class="secondary" onclick="act('retryPending')">重试失败消息</button>`:''}</div>`;
html+=pending.length?pending.map(s=>`<article class="card"><div class="meta"><div class="source"><strong>${esc(s.group)}</strong>发布人 · ${esc(s.publisher||'未识别')}</div><span class="tag">${s.aiState==='processing'?'整理中':s.aiState==='error'?'暂未成功':real.hasKey?'等待联网整理':'等待配置'}</span></div><p class="original">${esc(s.text)}</p>${s.error?`<p class="error small">${esc(s.error)}</p>`:''}</article>`).join(''):'<div class="empty"><h2>没有待处理消息</h2><p class="small muted">整理成功的事项会自动进入收件箱。</p></div>';
 }else if(page==='groups'){
const n=real.napcat||{groups:[],followed:[],pending:[],status:'等待配置本机连接'};n.pending=n.pending||[];
if(!groupTabChosen){groupBucket=n.followed.length?'followed':'available';groupTabChosen=true;}
html+=`<div class="notice">${esc(n.status)}<br>只接收关注之后的新消息。</div><div class="toolbar"><button class="secondary" onclick="go('settings')">管理 QQ 连接</button></div>`;
const followedCount=n.groups.filter(g=>n.followed.includes(String(g.group_id))).length;
html+=`<section class="card"><h2>关注群</h2><div class="group-tabs" role="group" aria-label="群列表范围"><button aria-pressed="${groupBucket==='available'}" class="${groupBucket==='available'?'active':''}" onclick="setGroupBucket('available')">待关注群 · ${n.groups.length-followedCount}</button><button aria-pressed="${groupBucket==='followed'}" class="${groupBucket==='followed'?'active':''}" onclick="setGroupBucket('followed')">已关注群 · ${followedCount}</button></div><label class="search group-search">${icon('search')}<input id="groupSearch" type="search" aria-label="搜索群名或群号" placeholder="搜索群名或群号" autocomplete="off" value="${esc(groupQuery)}" oninput="groupQuery=this.value;renderGroupList()"><button type="button" id="clearGroupSearch" aria-label="清空群搜索" onclick="clearGroupSearch()" ${groupQuery?'':'hidden'}>${icon('close')}</button></label><div id="groupList" class="group-results"></div></section>`;
html+=`<p class="small muted bannerline">取消关注后，已经保存的原文和卡片会保留。</p>`;

}else{
html+=`<section class="card"><div class="meta"><h2>DeepSeek</h2><span class="tag">云端提取</span></div><p class="small muted">手机联网后自动整理文字。电脑负责接收 QQ 消息，演示时请保持电脑运行和 USB 连接。</p><label class="formlabel" for="key">API 密钥 · ${real.hasKey?'已配置':'未配置'}</label><input class="field" type="password" id="key" autocomplete="off" placeholder="在手机上填写，不要发到聊天中"><div class="toolbar"><button class="primary" onclick="saveKey()">保存密钥</button><button class="textbtn" onclick="act('clearKey')">移除密钥</button></div><p class="small muted">密钥加密保存在本机；暂时无法整理的原文会保存在待处理。</p></section><section class="card"><h2>QQ 连接</h2><p class="muted small">${esc(real.napcat?.status||'等待连接 QQ 接入端')}</p><label class="formlabel" for="napcatKey">本机连接口令 · ${real.napcat?.hasToken?'已保存':'未配置'}</label><input class="field" id="napcatKey" type="password" autocomplete="off" placeholder="本机 NapCat 的接口口令"><div class="toolbar"><button class="primary" onclick="connectNapCat()">保存并连接</button><button class="textbtn" onclick="act('napcatStop')">暂停接收</button></div><p class="small muted">电脑端 NapCat 登录后保持 USB 连接，再到关注群页面选择群。断开 USB 后需重新运行电脑启动脚本。</p><div class="row"><span>诊断工具</span><button class="textbtn" onclick="act('diagnostics')">打开 ↗</button></div></section><p class="muted small">寻迹<br>当前支持文字消息整理，图片和附件暂不处理。</p>`;
}
const workspaceNav=`<nav class="workspace-nav" aria-label="信息与待办功能">${[['inbox','收件箱'],['todo','待办'],['groups','关注群'],['settings','设置']].map(([id,name])=>`<button class="${page===id||(page==='pending'&&id==='inbox')?'active':''}" ${page===id?'aria-current="page"':''} onclick="go('${id}')">${name}</button>`).join('')}</nav>`;
 document.getElementById('app').innerHTML=`<section class="workspace-shell"><div class="workspace-heading"><h1>信息与待办</h1><p class="small muted">收消息、管任务，都在这里。</p></div>${workspaceNav}<div class="workspace-content">${html}</div></section>`;renderMainNav();if(page==='inbox'||page==='todo')renderList();if(page==='groups')renderGroupList();}
function localDay(date=new Date()){return [String(date.getFullYear()).padStart(4,'0'),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function shiftDay(day,amount){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+amount);if(d.getFullYear()<1)return '0001-01-01';if(d.getFullYear()>9999)return '9999-12-31';return localDay(d)}
function dateLabel(day){return new Date(day+'T12:00:00').toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
function ordered(cards){return [...cards].sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||(a.dueTime||'99:99').localeCompare(b.dueTime||'99:99')||String(a.id).localeCompare(String(b.id)))}
function dayCards(day,includeDone=false){return ordered(data().cards.filter(c=>c.category!=='课程'&&c.dueDate===day&&(c.status==='todo'||includeDone&&c.status==='done')))}
function renderMainNav(){const workspace=!['today','schedule'].includes(page);document.getElementById('nav').innerHTML=[['today','今日'],['inbox','信息与待办'],['schedule','日程']].map(([id,name])=>{const active=page===id||(id==='inbox'&&workspace);return `<button class="${active?'active':''}" ${active?'aria-current="page"':''} onclick="go('${id}')">${icon(id)}<span>${name}</span></button>`}).join('')}
function eventFacts(event){return `<dl class="course-facts"><div><dt>地点</dt><dd>${esc(event.location||'未注明')}</dd></div><div><dt>时间</dt><dd>${esc(event.startTime)}—${esc(event.endTime)}</dd></div></dl>`}
function repeatLabel(r){return !r||r.rule==='none'?'仅一次':(r.rule==='biweekly'?'隔周一次':'每周一次')+' · 星期'+'一二三四五六日'[r.weekday-1]+' · '+(r.mode==='count'?r.count+'次（含首次）':'截止 '+r.until)}
function courseFacts(course){return `<dl class="course-facts"><div><dt>地点</dt><dd>${esc(course.location||'未注明')}</dd></div><div><dt>老师</dt><dd>${esc(course.teacher||'未注明')}</dd></div><div><dt>时间</dt><dd>${esc(course.startTime)}—${esc(course.endTime)}</dd></div>${course.repeat?'<div><dt>重复</dt><dd>'+esc(repeatLabel(course.repeat))+'</dd></div>':''}</dl>`}
function agendaRow(c,showDate=false){const course=c.category==='课程'?c.course:c.event;return `<div class="agenda-item ${c.status==='done'?'is-done':''}"><div class="agenda-time">${course?`${showDate?'<small>'+esc(c.dueDate.slice(5).replace('-','/'))+'</small>':''}<span>${esc(course.startTime)}</span><small>至 ${esc(course.endTime)}</small>`:esc(showDate?(c.dueDate?new Date(c.dueDate+'T12:00:00').toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'待定'):(c.dueTime||'未设时间'))}</div><div class="agenda-body"><button class="agenda-title" onclick="showAgenda('${esc(c.id)}')" aria-label="查看事项：${esc(c.title)}">${esc(c.title)}</button>${course?`<p class="small muted">${esc(course.location||'地点未注明')}</p>${c.category==='课程'?'<p class="small muted">老师：'+esc(course.teacher||'未注明')+'</p>':'<p class="small muted">'+esc(c.category)+'</p>'}`:`<p class="small muted">${esc(c.group)} · ${esc(c.category)}${showDate&&c.dueTime?' · '+esc(c.dueTime):''}</p>`}</div>${c.category==='课程'?(c.status==='deleted'?`<button class="secondary" onclick="state('${esc(c.id)}','restore')">恢复课程</button>`:c.status==='done'?`<span class="tag">${c.autoCompleted?'已下课':'已完成'}</span>`:c.status==='todo'?'<span class="tag">待上课</span>':`<button class="secondary" onclick="state('${esc(c.id)}','todo')">恢复课程</button>`):c.status==='todo'?`<button class="secondary agenda-complete" onclick="state('${esc(c.id)}','done')">完成</button>`:'<span class="tag">已完成</span>'}</div>`}
function showAgenda(id){const c=data().cards.find(c=>c.id===id);if(c)modal(`<div id="agendaDetail"><h2>事项详情</h2>${card(c)}</div>`)}
function hubSection(title,cls,cards,empty,showDate=false){return `<section class="day-section"><div class="section-heading"><h2>${title}</h2><span class="small muted">${cards.length} 项</span></div><div class="${cls}">${cards.length?cards.map(c=>agendaRow(c,showDate)).join(''):`<p class="day-empty muted">${empty}</p>`}</div></section>`}
function setScheduleDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;selectedDate=value;render()}
function setCourseDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;courseDate=value;coursePinned=value!==localDay();courseQuery='';showCourseManager()}
function showCourseManager(){modal(`<h2>课程管理</h2>${coursePanel()}`);renderCourseRows()}
function coursePanel(){if(!courseDate||!coursePinned)courseDate=localDay();return `<section class="day-section"><div class="section-heading"><h2>课程</h2><button class="textbtn" onclick="wakeupImport()">导入课表</button></div><p class="small muted">课程不进入普通待办，下课后自动完成；可在这里或日程表查看安排。</p><div class="date-controls"><button class="secondary" aria-label="前一天课程" onclick="setCourseDate(shiftDay(courseDate,-1))">‹</button><input class="field" type="date" aria-label="查看课程日期" value="${esc(courseDate)}" onchange="setCourseDate(this.value)"><button class="secondary" aria-label="后一天课程" onclick="setCourseDate(shiftDay(courseDate,1))">›</button></div><div class="search"><input type="search" id="courseSearch" aria-label="搜索课程（所有日期）" placeholder="搜索课程，查看所有日期" value="${esc(courseQuery)}" oninput="courseQuery=this.value;renderCourseRows()"></div><div class="schedule-options"><button class="textbtn" onclick="setCourseDate(localDay())">回到今天课程</button><label><input type="checkbox" ${courseTrash?'checked':''} onchange="courseTrash=this.checked;renderCourseRows()"> 已移除课程</label></div><div id="courseList"></div></section>`}
function renderCourseRows(){if(!coursePinned){courseDate=localDay();const input=document.querySelector('[aria-label="查看课程日期"]');if(input)input.value=courseDate;}const term=courseQuery.trim().toLowerCase(),today=localDay();let rows=data().cards.filter(c=>c.category==='课程'&&(courseTrash?c.status==='deleted':c.status!=='deleted')&&(term?[c.title,c.course?.teacher,c.course?.location].join(' ').toLowerCase().includes(term):courseTrash||c.dueDate===courseDate));rows.sort((a,b)=>{if(term){const af=a.dueDate>=today,bf=b.dueDate>=today;if(af!==bf)return af?-1:1;if(!af)return b.dueDate.localeCompare(a.dueDate)}return (a.dueDate||'').localeCompare(b.dueDate||'')||(a.dueTime||'').localeCompare(b.dueTime||'')});const list=document.getElementById('courseList');if(list)list.innerHTML=`<p class="small muted" role="status">${term?'匹配课程':courseTrash?'已移除课程':esc(dateLabel(courseDate))} · ${rows.length} 次安排${rows.length>40?'，显示最近40次':''}</p>${rows.slice(0,40).map(c=>agendaRow(c,true)).join('')||'<p class="day-empty muted">这一天没有课程，可换日期或搜索课程名称查看单双周安排。</p>'}`}
function setCalendarView(value){calendarView=value;render()}
function moveCalendar(amount){if(calendarView==='week'){setScheduleDate(shiftDay(selectedDate,amount*7));return}const d=new Date(selectedDate+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+amount);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));if(d.getFullYear()<1||d.getFullYear()>9999)return;setScheduleDate(localDay(d))}
const WEEK_HOUR=64;let savedWeekScroll=null;
function calendarCards(day,includeDone=showScheduleDone){return ordered(data().cards.filter(c=>c.dueDate===day&&(c.status==='todo'||c.status==='done'&&(includeDone||c.category==='课程'))))}
function minuteOfDay(value){const m=/^(\d{2}):(\d{2})$/.exec(value||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60 + +m[2]:null}
function weekTiming(c){const info=c.category==='课程'?c.course:c.event;if(info){const start=minuteOfDay(info.startTime),end=minuteOfDay(info.endTime);return start!==null&&end!==null&&end>start?{start,end,point:false}:null}const start=minuteOfDay(c.dueTime);return start===null?null:{start,end:start,point:true}}
function weekExtent(b){return b.point?b.start+60*60/WEEK_HOUR:Math.max(b.end,b.start+24*60/WEEK_HOUR)}
function weekLayout(rows){const blocks=rows.map(c=>({c,...weekTiming(c)})).filter(b=>b.start!==undefined).sort((a,b)=>a.start-b.start||b.end-a.end);let cluster=[],end=-1;const flush=()=>{for(let i=0;i<cluster.length;i++){const b=cluster[i];b.lane=0;b.columns=1;b.overlap=cluster.filter(v=>v.start<weekExtent(b)&&b.start<weekExtent(v)).length;b.inset=2+Math.min(6,1.5*(cluster.length-1))*i/Math.max(1,cluster.length-1)}cluster=[];end=-1};for(const b of blocks){if(cluster.length&&b.start>=end)flush();cluster.push(b);end=Math.max(end,weekExtent(b))}flush();return blocks}
function showWeekEvent(event,id,day){
 const rows=calendarCards(day).filter(c=>weekTiming(c)),clicked=rows.find(c=>c.id===id);if(!clicked)return;
 const timing=weekTiming(clicked),column=event.currentTarget.closest('.week-timed-day'),minute=(event.clientY-column.getBoundingClientRect().top)*60/WEEK_HOUR;
 let matches=rows.filter(c=>{const t=weekTiming(c);return event.detail===0?t.start<weekExtent(timing)&&timing.start<weekExtent(t):minute>=t.start&&minute<weekExtent(t)});
 if(!matches.length)matches=[clicked];if(matches.length===1){showAgenda(matches[0].id);return}
 modal(`<section id="scheduleOverlap"><h2>重叠日程 · ${matches.length}项</h2><p class="small muted">${esc(dateLabel(day))}，选择查看完整资料。</p><div class="overlap-choices">${matches.map(c=>{const t=weekTiming(c),info=c.category==='课程'?c.course:c.event;return `<button class="overlap-choice" aria-label="查看日程：${esc(c.title)}" onclick="showAgenda('${esc(c.id)}')"><strong>${esc(c.title)}</strong><span>${esc(t.point?c.dueTime+' 截止':info.startTime+'—'+info.endTime)} · ${esc(c.category)}</span></button>`}).join('')}</div></section>`);
}

function monthCalendar(start,total,month){return `<div class="calendar-surface" data-month="${esc(month)}" role="region" aria-label="月日程表" tabindex="0"><div class="month-weekdays" aria-hidden="true">${[...'一二三四五六日'].map(d=>`<span>周${d}</span>`).join('')}</div><div class="calendar-grid calendar-month">${Array.from({length:total},(_,i)=>{const day=shiftDay(start,i),items=calendarCards(day).sort((a,b)=>Number(!!weekTiming(a))-Number(!!weekTiming(b))||(a.dueTime||'').localeCompare(b.dueTime||''));return `<div class="month-day ${day.slice(0,7)!==month?'outside':''}" data-date="${day}"><button class="calendar-cell ${day===selectedDate?'selected':''}" aria-label="${day} · ${items.length}项" aria-pressed="${day===selectedDate}" onclick="setScheduleDate('${day}')"><strong>${Number(day.slice(-2))}</strong></button><div class="month-items">${items.map(c=>{const t=weekTiming(c),info=c.category==='课程'?c.course:c.event;return `<button class="month-event ${c.category==='课程'?'is-course':c.category==='考试'?'is-exam':c.category==='竞赛'?'is-contest':'is-event'} ${c.status==='done'?'is-ended':''}" aria-label="查看日程：${esc(c.title)}" onclick="showAgenda('${esc(c.id)}')"><strong>${esc(c.title)}</strong>${t?`<span>${esc(t.point?c.dueTime+' 截止':info.startTime+'—'+info.endTime)}</span>`:''}</button>`}).join('')}</div></div>`}).join('')}</div></div>`}
function captureWeekScroll(){const el=document.querySelector('.week-scroll');if(el)savedWeekScroll={week:el.dataset.week,top:el.scrollTop,left:el.scrollLeft};const month=document.querySelector('.calendar-surface[data-month]');if(month)savedMonthScroll={month:month.dataset.month,top:month.scrollTop}}
function initWeekScroll(){const el=document.querySelector('.week-scroll');if(!el)return;if(savedWeekScroll?.week===el.dataset.week){el.scrollTop=savedWeekScroll.top;el.scrollLeft=savedWeekScroll.left}else{const starts=[...el.querySelectorAll('.week-event')].map(e=>Number(e.dataset.start));const first=starts.length?Math.min(...starts):480;el.scrollTop=Math.max(0,Math.floor(first/60)-1)*WEEK_HOUR}refreshWeekNow()}
function refreshWeekNow(){const line=document.querySelector('.week-now');if(!line)return;const columns=[...document.querySelectorAll('.week-timed-day')],index=columns.findIndex(c=>c.dataset.date===localDay());line.hidden=index<0;if(index<0)return;const now=new Date(),minutes=now.getHours()*60+now.getMinutes();line.style.top=(minutes*WEEK_HOUR/60)+'px';line.style.left=(columns[index].offsetLeft+columns[index].parentElement.offsetLeft)+'px';line.style.width=columns[index].getBoundingClientRect().width+'px';line.setAttribute('aria-label','当前时间 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'))}
function hourWeek(start){const days=Array.from({length:7},(_,i)=>shiftDay(start,i));return `<div class="week-scroll" data-week="${start}" role="region" aria-label="每小时周日程表" tabindex="0"><div class="week-content"><div class="week-head"><span class="week-corner">时间</span>${days.map((day,i)=>`<button class="week-day-head calendar-cell ${day===selectedDate?'selected':''}" aria-label="${day} · ${calendarCards(day).length}项" onclick="setScheduleDate('${day}')"><span>周${'一二三四五六日'[i]}</span><strong>${Number(day.slice(-2))}</strong></button>`).join('')}</div><div class="week-all-day"><span class="week-corner">未定时</span>${days.map(day=>`<div class="week-undated">${calendarCards(day).filter(c=>!weekTiming(c)).map(c=>`<button class="week-date-task" aria-label="查看日程：${esc(c.title)}" onclick="showAgenda('${esc(c.id)}')">${esc(c.title)}</button>`).join('')}</div>`).join('')}</div><div class="week-stage"><div class="hour-axis">${Array.from({length:25},(_,h)=>`<span class="hour-label" style="top:${h*WEEK_HOUR}px">${String(h).padStart(2,'0')}:00</span>`).join('')}</div><div class="week-columns">${days.map(day=>`<div class="week-timed-day" data-date="${day}">${weekLayout(calendarCards(day).filter(c=>weekTiming(c))).map(b=>{const c=b.c,info=c.category==='课程'?c.course:c.event,time=b.point?c.dueTime:info.startTime+'—'+info.endTime;return `<button class="week-event ${c.category==='课程'?'is-course':c.category==='考试'?'is-exam':c.category==='竞赛'?'is-contest':'is-event'} ${b.point?'is-point':''} ${c.status==='done'?'is-ended':''}" data-id="${esc(c.id)}" data-start="${b.start}" data-end="${b.end}" data-point="${b.point}" data-lane="${b.lane}" data-columns="${b.columns}" style="top:${b.start*WEEK_HOUR/60}px;${b.point?`transform:none;top:${b.start*WEEK_HOUR/60}px;`:`height:${Math.max(24,(b.end-b.start)*WEEK_HOUR/60)}px;`}left:${b.inset}px;width:calc(100% - ${b.inset*2}px)" aria-label="查看日程：${esc(c.title)}，${day} ${esc(time)}${info?'，'+esc(info.location||'地点未注明')+(c.category==='课程'?'，老师 '+esc(info.teacher||'未注明'):''):''}" onclick="showWeekEvent(event,'${esc(c.id)}','${day}')">${b.overlap>1?'<span class="week-overlap-note">叠加</span>':''}<strong>${esc(c.title)}${b.point&&!c.title.endsWith('截止')?'截止':''}</strong><span>${esc(time)}</span>${info?`<span>${esc(info.location||'地点未注明')}</span>${c.category==='课程'?`<span>老师：${esc(info.teacher||'未注明')}</span>`:''}`:''}${c.status==='done'?'<span>已下课 / 完成</span>':''}</button>`}).join('')}</div>`).join('')}</div><div class="week-now" role="img" hidden></div></div></div></div>`}
function calendarGrid(){const month=selectedDate.slice(0,7),first=calendarView==='month'?month+'-01':selectedDate,offset=(new Date(first+'T12:00:00').getDay()+6)%7,start=shiftDay(first,-offset),total=Math.ceil((new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()+offset)/7)*7;return `<section class="calendar-panel"><div class="calendar-topbar"><div class="calendar-views"><button class="chip ${calendarView==='week'?'active':''}" aria-pressed="${calendarView==='week'}" onclick="setCalendarView('week')">周视图</button><button class="chip ${calendarView==='month'?'active':''}" aria-pressed="${calendarView==='month'}" onclick="setCalendarView('month')">月视图</button></div><input type="date" aria-label="选择日程日期" min="0001-01-01" max="9999-12-31" value="${esc(selectedDate)}" onchange="setScheduleDate(this.value)"><button class="secondary" aria-label="新建事项" onclick="chooseNewCategory()">＋</button></div><div class="calendar-controls"><button class="secondary" aria-label="${calendarView==='week'?'上一周':'上一月'}" onclick="moveCalendar(-1)">‹</button><strong>${calendarView==='week'?esc(start)+' — '+esc(shiftDay(start,6)):esc(month.replace('-','年'))+'月'}</strong><button class="secondary" aria-label="${calendarView==='week'?'下一周':'下一月'}" onclick="moveCalendar(1)">›</button></div><div class="calendar-filter"><button class="textbtn" onclick="setScheduleDate(localDay())">回到今天</button><label><input type="checkbox" ${showScheduleDone?'checked':''} onchange="showScheduleDone=this.checked;render()"> 显示已完成事项</label></div>${calendarView==='week'?hourWeek(start):monthCalendar(start,total,month)}</section>`}
function datedAgenda(today){
 const cards=ordered(data().cards.filter(c=>c.dueDate>=today&&(c.status==='todo'||c.category==='课程'&&c.status==='done')));
 const days=[...new Set([today,shiftDay(today,1),shiftDay(today,2),...cards.map(c=>c.dueDate)])].sort();
 return days.map(day=>{const items=cards.filter(c=>c.dueDate===day),label=day===today?'今天':day===shiftDay(today,1)?'明天':day===shiftDay(today,2)?'后天':dateLabel(day);return `<section class="date-agenda ${day===today?'is-today':''}" data-agenda-date="${esc(day)}"><div class="date-agenda-heading"><h2>${esc(label)}</h2><div><span class="date-line">${esc(day===today||day===shiftDay(today,1)||day===shiftDay(today,2)?dateLabel(day):day)}</span><span class="small muted">${items.length} 项</span></div></div><div class="date-agenda-list ${day===today?'today-list':''}">${items.length?items.map(c=>agendaRow(c)).join(''):'<p class="day-empty muted">'+(day===today?'今天没有已安排的待办':'这一天暂无安排')+'</p>'}</div></section>`}).join('');
}

 document.getElementById('cardTitle').value=c.title;const course=c.course||c.event||{};document.getElementById('courseLocation').value=course.location||'';document.getElementById('courseTeacher').value=course.teacher||'';document.getElementById('courseFrom').value=course.startTime||'';document.getElementById('courseTo').value=course.endTime||'';window.editorCourse={...course};window.editorOriginalCategory=c.category;window.editorHadInterval=!!c.event;document.getElementById('cardCategory').value=c.category;document.getElementById('cardRequirements').value=c.requirements.join('\n');document.getElementById('cardDeadline').value=c.deadline;document.getElementById('cardDueDate').value=c.dueDate||'';document.getElementById('cardDueTime').value=c.dueTime||'';for(const input of ['cardDueDate','cardDueTime'])document.getElementById(input).oninput=()=>{editorAutomatic=false;document.getElementById('autoDeadlineHint').hidden=true;if(input==='cardDueDate'&&!editingId&&document.getElementById('cardDueDate').value)document.getElementById('repeatWeekday').value=String(new Date(document.getElementById('cardDueDate').value+'T12:00:00').getDay()||7)};
 document.getElementById('repeatWeekday').value=String(new Date((c.dueDate||localDay())+'T12:00:00').getDay()||7);document.getElementById('repeatRule').onchange=updateRepeatFields;document.getElementById('repeatMode').onchange=updateRepeatFields;document.getElementById('courseFrom').oninput=updateCourseEditor;document.getElementById('courseTo').oninput=updateCourseEditor;document.getElementById('cardCategory').onchange=updateCourseEditor;updateCourseEditor();editorInitial=JSON.stringify(editorValue());document.getElementById('cardForm').onsubmit=e=>{e.preventDefault();saveCard()};document.querySelector('#modal .close').onclick=closeEditor;document.getElementById('cardTitle').focus();
}
const timedCategories=['课程','活动','考试','竞赛'];
function editorStructured(){const category=document.getElementById('cardCategory').value;return category==='课程'||timedCategories.includes(category)&&(!editingId||window.editorHadInterval||category!==window.editorOriginalCategory||!!document.getElementById('courseFrom').value||!!document.getElementById('courseTo').value)}
function updateRepeatFields(){const repeat=document.getElementById('repeatRule').value!=='none';document.getElementById('repeatOptions').hidden=!repeat;const until=document.getElementById('repeatMode').value==='until';for(const id of ['repeatCount','repeatUntil']){document.getElementById(id).hidden=(id==='repeatUntil')!==until;document.querySelector('label[for="'+id+'"]').hidden=(id==='repeatUntil')!==until}}
function updateCourseEditor(){const category=document.getElementById('cardCategory').value,course=category==='课程',timed=editorStructured();document.getElementById('courseEditorFields').hidden=!timedCategories.includes(category);document.getElementById('courseTeacher').hidden=!course;document.querySelector('label[for="courseTeacher"]').hidden=!course;document.querySelector('label[for="courseLocation"]').textContent=course?'教室':'地点';document.querySelector('label[for="courseFrom"]').textContent=course?'上课开始时间':'开始时间';document.querySelector('label[for="courseTo"]').textContent=course?'上课结束时间':'结束时间';document.getElementById('cardDeadline').hidden=timed;document.querySelector('label[for="cardDeadline"]').hidden=timed;document.getElementById('cardDueTime').hidden=timed;document.querySelector('label[for="cardDueTime"]').hidden=timed;document.querySelector('.schedule-adjust button').hidden=timed;document.querySelector('label[for="cardDueDate"]').textContent=timed?(course?'上课日期':'事项日期'):'截止日期';document.querySelector('.schedule-adjust summary').textContent=timed?'日期安排':'调整截止日期与时间（可选）';document.getElementById('scheduleHelp').textContent=timed?'按实际日期和开始时间进入今日待办与日程。编辑只影响当前一次安排。':'默认按消息截止时间自动显示，无需逐条填写。手动调整只影响当前事项。';document.getElementById('repeatFields').hidden=!course||!!editingId;if(timed){document.querySelector('.schedule-adjust').open=true;if(!editingId&&!document.getElementById('cardDueDate').value)document.getElementById('cardDueDate').value=page==='schedule'&&selectedDate?selectedDate:localDay()}updateRepeatFields();}
function editorValue(){const row={id:editingId,title:document.getElementById('cardTitle').value.trim(),category:document.getElementById('cardCategory').value,requirements:document.getElementById('cardRequirements').value.split('\n').map(v=>v.trim()).filter(Boolean),deadline:document.getElementById('cardDeadline').value.trim(),dueDate:document.getElementById('cardDueDate').value,dueTime:document.getElementById('cardDueTime').value,automaticDeadline:editorAutomatic};if(editorStructured()){const info={...window.editorCourse,name:row.title,location:document.getElementById('courseLocation').value.trim(),teacher:document.getElementById('courseTeacher').value.trim(),startTime:document.getElementById('courseFrom').value,endTime:document.getElementById('courseTo').value};if(row.category==='课程')row.course=info;else row.event=info;row.dueTime=info.startTime;row.automaticDeadline=false;if(row.category==='课程'&&!editingId)row.repeat={rule:document.getElementById('repeatRule').value,weekday:Number(document.getElementById('repeatWeekday').value),mode:document.getElementById('repeatMode').value,count:Number(document.getElementById('repeatCount').value),until:document.getElementById('repeatUntil').value}}return row}
function useAutomaticDeadline(){editorAutomatic=true;document.getElementById('cardDueDate').value='';document.getElementById('cardDueTime').value='';document.getElementById('autoDeadlineHint').hidden=false}
function requestEditorExit(after){
 const dialog=document.getElementById('modal');
 if(!document.getElementById('cardForm')||JSON.stringify(editorValue())===editorInitial){dialog.close();if(after)after();return}
 let prompt=document.getElementById('discardPrompt');if(prompt)prompt.remove();
 prompt=document.createElement('section');prompt.id='discardPrompt';prompt.className='discard-prompt';prompt.setAttribute('role','alert');
 prompt.innerHTML='<h3>放弃尚未保存的修改？</h3><p class="small">当前内容尚未保存。</p><div class="toolbar"><button type="button" class="secondary" id="keepEditing">继续编辑</button><button type="button" class="danger" id="discardEditing">放弃修改</button></div>';
 document.getElementById('cardForm').prepend(prompt);document.getElementById('keepEditing').onclick=()=>{prompt.remove();document.getElementById('cardTitle').focus()};document.getElementById('discardEditing').onclick=()=>{dialog.close();if(after)after()};prompt.scrollIntoView({block:'nearest'});document.getElementById('keepEditing').focus();
}
function closeEditor(){requestEditorExit()}

function saveCard(){const value=editorValue();if(value.dueTime&&!value.dueDate){showSaveError('请先选择日期，再填写时间');document.getElementById('cardDueDate').focus();return}const info=value.course||value.event;if(info&&(!value.dueDate||!info.startTime||!info.endTime||info.endTime<=info.startTime)){showSaveError('请填写日期和完整的起止时间');return}if(value.repeat?.rule!=='none'&&value.repeat){if(value.repeat.mode==='count'&&(!Number.isInteger(value.repeat.count)||value.repeat.count<1||value.repeat.count>104)||value.repeat.mode==='until'&&!value.repeat.until){showSaveError('请填写有效的重复次数或截止日');return}}if(!value.title){showSaveError('请填写标题');document.getElementById('cardTitle').focus();return}if(mutate(editingId?'updateCard':'createCard',value)){document.getElementById('modal').close();toast(editingId?'已保存修改':'已创建待办')}}
 document.getElementById('modal').addEventListener('cancel',e=>{if(document.getElementById('cardForm')){e.preventDefault();closeEditor()}});
let wakeupPreviewId='';
function wakeupImport(){wakeupPreviewId='';modal(`<h2>导入课表</h2><p class="small muted">先读取并核对课程、老师、地点、起止时间和上课周次，再加入每日待办。</p><section id="wakeupForm"><label class="formlabel" for="wakeupCode">WakeUp分享口令</label><textarea id="wakeupCode" maxlength="3000" placeholder="粘贴完整分享文字或口令"></textarea><div class="toolbar"><button class="primary" id="readWakeup" onclick="readWakeup()">读取课表</button><button class="secondary" onclick="readWakeupFile()">选择ICS / WakeUp文件</button></div><p class="small muted">支持 .ics 日历或 WakeUp 导出的课表文件；新版口令可能无法由分享接口读取。课表不发送给AI。</p><p id="wakeupError" class="error" role="alert" hidden></p><div id="wakeupPreview"></div></section>`);document.querySelector('#modal .close').onclick=()=>{act('wakeupCancel');document.getElementById('modal').close()};}
function readWakeup(){const text=document.getElementById('wakeupCode').value.trim();if(!text)return toast('请先粘贴分享口令');wakeupPreviewId='';document.getElementById('wakeupPreview').innerHTML='';const button=document.getElementById('readWakeup');button.disabled=true;button.textContent='正在读取…';document.getElementById('wakeupError').hidden=true;act('wakeupPreview',text)}
function readWakeupFile(){wakeupPreviewId='';document.getElementById('wakeupPreview').innerHTML='';act('wakeupFile')}
function wakeupPreviewReady(result){if(!document.getElementById('wakeupForm'))return;const button=document.getElementById('readWakeup');button.disabled=false;button.textContent='读取课表';const error=document.getElementById('wakeupError');if(!result.ok){wakeupPreviewId='';error.textContent=result.error||'读取失败，未导入';error.hidden=false;return}error.hidden=true;wakeupPreviewId=result.id;
 document.getElementById('wakeupPreview').innerHTML=`<h3>${esc(result.tableName)}</h3><p class="small muted">${result.meetings[0]?.format==='ics'?'最早课程日期':'第一周基准日期'}：${esc(result.termStart)}<br>${result.meetings.length} 条课程安排，将展开为 ${result.count} 次每日课程待办。</p>${result.meetings.map(c=>`<section class="course-preview"><h3>${esc(c.name)}</h3>${courseFacts(c)}${c.description?'<div class="original">'+esc(c.description)+'</div>':''}<p class="small muted">星期${'一二三四五六日'[c.day-1]} · ${c.format==='ics'?esc(c.date):c.explicitWeeks?esc(c.weeks.join('、'))+'周':c.startWeek+'—'+c.endWeek+'周 · '+(c.weekType===1?'单周':c.weekType===2?'双周':'每周')}${c.format==='ics'?'':'<br>第'+c.startNode+'—'+(c.startNode+c.step-1)+'节'}</p></section>`).join('')}<p class="small muted">重复课次保留已有记录；完成和删除状态不被覆盖。</p><p id="saveError" class="error" role="alert" hidden></p><button class="primary block" onclick="confirmWakeup()">确认导入课程</button>`;
}
function confirmWakeup(){if(wakeupPreviewId&&mutate('importWakeup',{id:wakeupPreviewId})){wakeupPreviewId='';document.getElementById('modal').close();toast(window.lastMutation?.todayCount!==undefined?'已导入：今天 '+lastMutation.todayCount+' 节；'+(lastMutation.nextDate?'最近课程 '+lastMutation.nextDate:'暂无未来课程'):'课程已导入，按实际日期进入今日待办和日程')}}
 document.getElementById('modal').addEventListener('cancel',()=>{if(document.getElementById('wakeupForm'))act('wakeupCancel')});
let memoryText='',memoryPreviewId='',memoryRequestToken='',memorySequence=0;
function memoryEntry(){act('memoryCancel');memoryRequestToken=String(++memorySequence);memoryPreviewId='';modal(`<h2>口头记忆</h2><section id="memoryForm"><label class="sr" for="memoryBody">记忆内容</label><textarea id="memoryBody" class="memory-input" maxlength="50000" placeholder="输入要记住的事，也可以用输入法语音输入…"></textarea><button class="primary block" id="memoryRead" onclick="readMemory()">DeepSeek整理</button><p id="memoryError" class="error" role="alert" hidden></p><div id="memoryPreview"></div></section>`);const input=document.getElementById('memoryBody');input.value=memoryText;input.oninput=()=>{memoryText=input.value;memoryRequestToken=String(++memorySequence);memoryPreviewId='';document.getElementById('memoryPreview').innerHTML='';document.getElementById('memoryRead').disabled=false;document.getElementById('memoryRead').textContent='DeepSeek整理';act('memoryCancel')};document.querySelector('#modal .close').onclick=()=>{act('memoryCancel');document.getElementById('modal').close()};input.focus();}
document.getElementById('modal').addEventListener('close',()=>{if(document.getElementById('memoryForm')&&!document.getElementById('modal').open)act('memoryCancel')});
function readMemory(){memoryText=document.getElementById('memoryBody').value.trim();if(!memoryText)return toast('请先输入要整理的内容');memoryPreviewId='';document.getElementById('memoryPreview').innerHTML='';document.getElementById('memoryError').hidden=true;const button=document.getElementById('memoryRead');button.disabled=true;button.textContent='正在整理…';memoryRequestToken=String(++memorySequence);act('memoryPreview',JSON.stringify({text:memoryText,requestToken:memoryRequestToken}))}
function memoryReady(result){if(!document.getElementById('memoryForm')||result.requestToken!==memoryRequestToken)return;const button=document.getElementById('memoryRead');button.disabled=false;button.textContent='DeepSeek整理';const error=document.getElementById('memoryError');if(!result.ok){memoryPreviewId='';error.hidden=false;error.textContent=result.error||'整理失败，内容仍保留';return}error.hidden=true;memoryPreviewId=result.cards.length?result.id:'';document.getElementById('memoryPreview').innerHTML=result.cards.length?`<h3>核对 ${result.cards.length} 项待办</h3>${result.cards.map(c=>`<section class="course-preview"><span class="tag">${esc(c.category)}</span><h3>${esc(c.title)}</h3><p>${esc(c.dueDate||'日期未明确')} ${esc(c.dueTime||'')}</p>${c.course?courseFacts(c.course):c.event?eventFacts(c.event):''}${c.repeat?`<p>重复：${c.repeat.rule==='biweekly'?'隔周':'每周'} · 星期${'一二三四五六日'[c.repeat.weekday-1]} · ${c.repeat.mode==='count'?esc(c.repeat.count)+'次（含首次）':'截止 '+esc(c.repeat.until)}</p>`:''}<ul class="requirements">${c.requirements.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></section>`).join('')}<p class="small muted">有误请修改上方文字后重新整理；保存会保留原始记忆文字。</p><p id="saveError" class="error" role="alert" hidden></p><button class="primary block" onclick="confirmMemory()">确认加入待办</button>`:'<p class="day-empty muted">没有识别到明确待办，原有事项保持不变。</p>'}
function confirmMemory(){if(memoryPreviewId&&mutate('saveMemory',{id:memoryPreviewId})){memoryPreviewId='';memoryText='';document.getElementById('modal').close();page='today';render();toast('已加入待办，按日期同步到今日与日程')}}
document.getElementById('modal').addEventListener('cancel',()=>{if(document.getElementById('memoryForm'))act('memoryCancel')});
function paste(sharedText=""){if(document.getElementById('modal').open&&document.getElementById('cardForm')){requestEditorExit(()=>paste(sharedText));return}modal(`<h2>粘贴一条通知</h2><p class="muted small">原文先保存，配置密钥后会自动整理成卡片。</p><label class="formlabel" for="group">来源群</label><input class="field" id="group" value="手动输入"><label class="formlabel" for="publisher">发布人 · 可留空</label><input class="field" id="publisher"><label class="formlabel" for="body">通知原文</label><textarea id="body" maxlength="50000" placeholder="粘贴 QQ 通知文字…"></textarea><div class="toolbar"><button class="primary" onclick="savePaste()">保存并自动整理</button></div>`);document.getElementById('body').value=sharedText;}
function savePaste(){const text=document.getElementById('body').value.trim();if(!text)return toast('请先填写原文');if(!native)return toast('请在手机上保存消息');act('paste',JSON.stringify({group:document.getElementById('group').value||'手动输入',publisher:document.getElementById('publisher').value,text}));document.getElementById('modal').close();page='inbox';render()}
function connectNapCat(){const input=document.getElementById('napcatKey');act('napcatConnect',input.value);input.value=''}
function prefillNapCatToken(token){page='settings';render();document.getElementById('napcatKey').value=token;toast('本机口令已填入，请保存并连接')}
function saveKey(){const el=document.getElementById('key');if(!el.value.trim())return toast('请先填写密钥');act('saveKey',el.value);el.value=''}
function unfollow(index){const name=real.groups[index];modal(`<h2>取消关注这个群？</h2><p>${esc(name)}</p><p class="muted small">已有原文和卡片会保留，此后的新通知不再接收。</p><button class="primary" id="unfollowConfirm">确认取消关注</button>`);document.getElementById('unfollowConfirm').onclick=()=>{act('unfollow',name);document.getElementById('modal').close()}}
let pullStart=null,pullDistance=0;
function manualRefresh(){if(document.getElementById('modal').open)return;refreshNative();render();toast('待办已刷新')}
document.addEventListener('touchstart',e=>{if(page==='today'&&!document.getElementById('modal').open&&window.scrollY<=0&&e.touches.length===1&&!e.target.closest('input,textarea,select,button'))pullStart={x:e.touches[0].clientX,y:e.touches[0].clientY};else pullStart=null;pullDistance=0},{passive:true});
document.addEventListener('touchmove',e=>{if(!pullStart||e.touches.length!==1)return;const dx=e.touches[0].clientX-pullStart.x,dy=e.touches[0].clientY-pullStart.y;if(Math.abs(dx)>40||dy<0){pullStart=null;return}pullDistance=dy;if(dy>24){e.preventDefault();document.getElementById('pullStatus').hidden=false;document.getElementById('pullStatus').textContent=dy>=80?'松开刷新待办':'下拉刷新待办'}},{passive:false});
document.addEventListener('touchend',()=>{const refresh=pullStart&&pullDistance>=80;pullStart=null;pullDistance=0;document.getElementById('pullStatus').hidden=true;if(refresh)manualRefresh()});document.addEventListener('touchcancel',()=>{pullStart=null;pullDistance=0;document.getElementById('pullStatus').hidden=true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.getElementById('modal').open)refreshNative()});window.addEventListener('focus',()=>{if(!document.getElementById('modal').open)refreshNative()});
document.getElementById('logo').innerHTML=icon('logo');document.getElementById('add').innerHTML=icon('plus');render();refreshNative();setInterval(()=>{if(native&&!document.getElementById('modal').open&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA')refreshNative()},1500);
</script></body></html>
